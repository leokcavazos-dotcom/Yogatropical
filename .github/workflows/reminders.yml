# Sends class reminder emails. Vercel's free plan only runs crons once a day,
# so GitHub calls the site's reminder job every 15 minutes instead.
# Needs the repository secret CRON_SECRET (same value as in Vercel).
name: Class reminders

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET isn't set in the repository secrets yet; skipping."
            exit 0
          fi
          curl -fsS --max-time 240 -H "Authorization: Bearer $CRON_SECRET" https://www.yogatropical.com/api/cron/send-reminders
